version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: rentsure-postgres
    environment:
      POSTGRES_USER: rentsure
      POSTGRES_PASSWORD: rentsure_password
      POSTGRES_DB: rentsure_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
