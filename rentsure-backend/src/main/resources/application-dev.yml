spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rentsure_db
    username: rentsure
    password: rentsure_password
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
